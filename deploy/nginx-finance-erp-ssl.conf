# /etc/nginx/sites-available/finance-erp-ssl
#
# TLS front end for a LAN install on a bare IP, using the self-signed certificate
# from DEPLOYMENT.md section 8. Kept in its own file so the plain-HTTP block stays
# untouched: port 80 keeps serving the stations that only use an NFC reader or a
# USB scanner, and a mistake here cannot take those down.
#
# The kiosk's camera needs this. Browsers expose getUserMedia only on a trusted
# origin, and an https:// origin qualifies once its warning has been accepted.
server {
    # "listen 443 ssl http2" rather than the newer separate "http2 on" directive:
    # that one needs nginx 1.25.1, and Ubuntu 24.04 ships 1.24. This form works on
    # both, and only draws a deprecation warning on the newer one.
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/ssl/certs/mei-erp.crt;
    ssl_certificate_key /etc/ssl/private/mei-erp.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Blazor Server runs over a websocket; without these the UI drops every
        # few seconds in a way that looks like an application fault.
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 100s;

        # A Super Admin's auth cookie carries 124 permission claims across several
        # Set-Cookie headers. nginx's 4-8k default cannot hold that, and answers
        # 502 immediately after a login the application logged as successful.
        proxy_buffer_size       32k;
        proxy_buffers           8 32k;
        proxy_busy_buffers_size 64k;
    }
}
