# /etc/nginx/sites-available/finance-erp
# Reverse proxy in front of Kestrel. Blazor Server needs WebSocket support.
server {
    listen 80;
    server_name erp.example.com;   # change to your domain or LXC IP

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 100s;   # keep Blazor circuits alive

        # The auth cookie carries every permission the user holds — a Super Admin
        # has 124 of them, which ASP.NET encrypts and chunks across several
        # Set-Cookie headers totalling well over nginx's 4-8k default. Too small
        # and nginx rejects the response with 502 immediately after a login the
        # application itself logged as successful.
        proxy_buffer_size       32k;
        proxy_buffers           8 32k;
        proxy_busy_buffers_size 64k;
    }
}
